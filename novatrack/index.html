/* ---------- charts ---------- */
function Spark({data,tone='accent'}){
  const w=120,h=40,min=Math.min(...data),max=Math.max(...data);
  const pts=data.map((v,i)=>[i*(w/(data.length-1)),h-4-((v-min)/(max-min||1))*(h-10)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const last=pts[pts.length-1]; const id='g'+tone+data.length+data[0];
  return <svg viewBox={`0 0 ${w} ${h}`} className="w-28 h-10 overflow-visible" aria-hidden="true">
    <defs><linearGradient id={id} x1="0" x2="0" y1="0" y2="1"><stop offset="0" stopColor={`rgb(var(--${tone}))`} stopOpacity=".22"/><stop offset="1" stopColor={`rgb(var(--${tone}))`} stopOpacity="0"/></linearGradient></defs>
    <path d={`${d} L${w} ${h} L0 ${h}Z`} fill={`url(#${id})`}/>
    <path d={d} fill="none" stroke={`rgb(var(--${tone}))`} strokeWidth="2" strokeLinejoin="round"/>
    <circle cx={last[0]} cy={last[1]} r="3.2" fill={`rgb(var(--${tone}))`} stroke="rgb(var(--surface))" strokeWidth="2"/>
  </svg>;
}
function RevenueChart(){
  const m=['Май','Июн','Июл','Авг','Сен','Окт'], rev=[62,71,68,79,84,86.4], cost=[41,44,47,49,52,53];
  const W=560,H=230,L=40,B=30,T=10,top=100, y=v=>T+(H-T-B)*(1-v/top), slot=(W-L-8)/m.length;
  const [hover,setHover]=useState(5);
  return <div>
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto" role="img" aria-label="Выручка и себестоимость по месяцам, май–октябрь 2026">
      {[0,25,50,75,100].map(t=><g key={t}><line x1={L} x2={W-8} y1={y(t)} y2={y(t)} stroke="rgb(var(--line))" strokeDasharray={t?'3 4':''}/>
        <text x={L-8} y={y(t)+4} textAnchor="end" fontSize="11" fill="rgb(var(--muted))" fontFamily="var(--mono)">{t}</text></g>)}
      {m.map((mo,i)=>{const cx=L+slot*i+slot/2, bw=Math.min(16,slot/4), on=i===hover;
        return <g key={mo} onMouseEnter={()=>setHover(i)} onFocus={()=>setHover(i)} tabIndex="0" style={{cursor:'pointer',outline:'none'}}>
          <rect x={L+slot*i} y={T} width={slot} height={H-T-B} fill={on?'rgb(var(--surface2))':'transparent'} rx="8"/>
          <rect x={cx-bw-2} y={y(rev[i])} width={bw} height={y(0)-y(rev[i])} rx="4" fill="rgb(var(--accent))" opacity={on?1:.85}/>
          <rect x={cx+2} y={y(cost[i])} width={bw} height={y(0)-y(cost[i])} rx="4" fill="rgb(var(--accent2))" opacity={on?1:.85}/>
          <text x={cx} y={H-10} textAnchor="middle" fontSize="11.5" fill={on?'rgb(var(--ink))':'rgb(var(--muted))'} fontWeight={on?600:400}>{mo}</text>
        </g>;})}
    </svg>

      <span className="flex items-center gap-2"><span className="h-2.5 w-2.5 rounded-sm bg-accent2"/>Себестоимость <b className="num">€{cost[hover]} тыс.</b></span>
      <span className="text-muted">Маржа <b className="num text-ink">{Math.round((1-cost[hover]/rev[hover])*100)}%</b> · {m[hover]}</span>
    </div>
  </div>;
}
function Donut({parts}){
  const total=parts.reduce((a,p)=>a+p.v,0), r=52, C=2*Math.PI*r; let acc=0;
  return <svg viewBox="0 0 140 140" className="w-36 h-36 shrink-0" role="img" aria-label="Распределение проектов по статусу">
    <circle cx="70" cy="70" r={r} fill="none" stroke="rgb(var(--surface2))" strokeWidth="14"/>
    {parts.map(p=>{const len=p.v/total*C, el=<circle key={p.k} cx="70" cy="70" r={r} fill="none" stroke={`rgb(var(--${p.tone}))`} strokeWidth="14" strokeDasharray={`${Math.max(len-3,0)} ${C}`} strokeDashoffset={-acc} transform="rotate(-90 70 70)" strokeLinecap="round"/>; acc+=len; return el;})}
    <text x="70" y="68" textAnchor="middle" fontSize="26" fontFamily="var(--display)" fontWeight="700" fill="rgb(var(--ink))">{total}</text>
    <text x="70" y="88" textAnchor="middle" fontSize="11" fill="rgb(var(--muted))">активных</text>
  </svg>;
}

function Projects({initial,openProject}){
  const [q,setQ]=useState(initial.q||''); const [st,setSt]=useState(initial.status||'Все');
  const [sort,setSort]=useState({k:'due',dir:1});
  useEffect(()=>{setQ(initial.q||'');setSt(initial.status||'Все')},[initial]);
  const filters=['Все','В графике','Под риском','Заблокирован','Планирование','Готово'];
  const rows=useMemo(()=>{
    let r=PROJECTS.filter(p=>(st==='Все'||p.status===st)&&(p.name+p.client+p.id).toLowerCase().includes(q.toLowerCase()));
    const val=p=>sort.k==='due'?new Date(p.due):sort.k==='burn'?p.spent/p.budget:p[sort.k];
    return [...r].sort((a,b)=>(val(a)>val(b)?1:-1)*sort.dir);
  },[q,st,sort]);
  const count=s=>s==='Все'?PROJECTS.length:PROJECTS.filter(p=>p.status===s).length;
  const Th=({k,children,cls=''})=><th className={`px-4 py-3 font-semibold ${cls}`}><button onClick={()=>setSort(s=>({k,dir:s.k===k?-s.dir:1}))} className="inline-flex items-center gap-1 hover:text-ink">{children}{sort.k===k&&<span aria-hidden="true">{sort.dir>0?'↑':'↓'}</span>}</button></th>;
  return <div className="space-y-5 fade">
    <div className="flex flex-wrap items-end justify-between gap-3"><div><p className="eyebrow">Рабочее пространство</p><h1 className="text-2xl font-bold">Проекты</h1></div>
      <button className="inline-flex items-center gap-2 rounded-xl bg-accent px-4 py-2.5 text-sm font-semibold text-white hover:bg-accent/90"><Icon n="plus" className="h-4 w-4"/>Новый проект</button></div>
    <Card className="overflow-hidden">
      <div className="flex flex-col gap-3 border-b border-line p-4 lg:flex-row lg:items-center lg:justify-between">
        <div className="flex flex-wrap gap-1.5" role="tablist">{filters.map(f=><button key={f} role="tab" aria-selected={st===f} onClick={()=>setSt(f)} className={`rounded-full px-3 py-1.5 text-sm font-medium ${st===f?'bg-ink text-surface':'text-muted hover:bg-surface2'}`}>{f} <span className="num text-xs opacity-70">{count(f)}</span></button>)}</div>
        <label className="relative block lg:w-72"><span className="sr-only">Фильтр проектов</span><Icon n="search" className="absolute left-3 top-2.5 h-4 w-4 text-muted"/>
          <input id="proj-q" value={q} onChange={e=>setQ(e.target.value)} placeholder="Название, клиент или ID" className="w-full rounded-xl border border-line bg-bg py-2 pl-9 pr-3 text-sm placeholder:text-muted focus:outline-none focus:ring-2 focus:ring-accent/40"/></label>
      </div>
      <div className="overflow-x-auto">
        <table className="w-full min-w-[860px] text-sm">
          <thead className="text-left text-xs text-muted bg-surface2/60"><tr><Th k="name">Проект</Th><Th k="status">Статус</Th><Th k="priority">Приоритет</Th><Th k="progress">Прогресс</Th><Th k="burn">Бюджет</Th><Th k="due">Срок</Th><th className="px-4 py-3 font-semibold">Команда</th></tr></thead>
          <tbody className="divide-y divide-line">
            {rows.map(p=>{const d=daysUntil(p.due), burn=Math.round(p.spent/p.budget*100);
              return <tr key={p.id} onClick={()=>openProject(p)} className="cursor-pointer hover:bg-surface2/50">
                <td className="px-4 py-3.5"><button className="flex items-center gap-3 text-left" onClick={e=>{e.stopPropagation();openProject(p)}}><Thumb p={p}/><span><span className="block font-semibold">{p.name}</span><span className="block text-xs text-muted"><span className="num">{p.id}</span> · {p.client}</span></span></button></td>
                <td className="px-4"><Pill s={p.status}/></td>
                <td className="px-4"><Prio p={p.priority}/></td>
                <td className="px-4 w-40"><div className="flex items-center gap-2"><Bar v={p.progress} tone={p.status==='Готово'?'muted':'accent'}/><span className="num text-xs w-9 text-right">{p.progress}%</span></div></td>
                <td className="px-4"><span className={`num ${burn>p.progress+15&&p.status!=='Готово'?'text-bad font-semibold':''}`}>{burn}%</span> <span className="text-xs text-muted num">из {eur(p.budget)}</span></td>
                <td className="px-4 whitespace-nowrap"><p className="num">{fmtDate(p.due)}</p><p className={`text-xs ${p.status==='Готово'?'text-muted':d<0?'text-bad':d<=7?'text-warn':'text-muted'}`}>{p.status==='Готово'?'Сдан':d<0?`просрочен на ${-d} дн.`:`через ${d} дн.`}</p></td>
                <td className="px-4"><div className="flex -space-x-2">{p.owners.map(o=><Avatar key={o} k={o}/>)}</div></td>
              </tr>;})}
            {!rows.length&&<tr><td colSpan="7" className="px-4 py-12 text-center text-muted">Нет проектов по запросу «{q}» в разделе «{st}». <button className="font-semibold text-accent" onClick={()=>{setQ('');setSt('Все')}}>Сбросить фильтры</button></td></tr>}
          </tbody>
        </table>
      </div>
      <p className="border-t border-line px-4 py-3 text-xs text-muted">Показано {rows.length} из {PROJECTS.length}. Бюджет подсвечивается красным, если расходы опережают прогресс на 15+ п.п.</p>
    </Card>
  </div>;
}

function Tasks(){

  const move=(id,dir)=>setTasks(ts=>ts.map(t=>t.id===id?{...t,col:COLS[Math.min(COLS.length-1,Math.max(0,COLS.indexOf(t.col)+dir))]}:t));
  const tone={'К работе':'muted','В работе':'accent','На проверке':'accent2','Заблокирован':'bad','Готово':'ok'};
  return <div className="space-y-5 fade">
    <div className="flex flex-wrap items-end justify-between gap-3"><div><p className="eyebrow">Текущий спринт · 6–19 октября</p><h1 className="text-2xl font-bold">Доска задач</h1></div>
      <label className="inline-flex items-center gap-2 text-sm cursor-pointer"><input id="mine" type="checkbox" checked={mine} onChange={e=>setMine(e.target.checked)} className="h-4 w-4 accent-[rgb(var(--accent))]"/>Только мои задачи (Марк)</label></div>
    <div className="grid gap-4 sm:grid-cols-2 xl:grid-cols-5">
      {COLS.map(col=>{const list=tasks.filter(t=>t.col===col&&(!mine||t.who==='MR'));
        return <div key={col} className="rounded-2xl bg-surface2/70 p-3 min-w-0">

          <div className="space-y-2.5">{list.map(t=>{const d=daysUntil(t.due);
            return <article key={t.id} className="rounded-xl border border-line bg-surface p-3">
              <p className="text-xs text-muted num">{t.p}</p><p className="mt-0.5 font-semibold leading-snug">{t.t}</p>
              <div className="mt-3 flex items-center justify-between"><Avatar k={t.who} size={24}/>
                <span className={`inline-flex items-center gap-1 text-xs ${col==='Готово'?'text-muted':d<=1?'text-bad':d<=4?'text-warn':'text-muted'}`}><Icon n="clock" className="h-3.5 w-3.5"/>{fmtDate(t.due)}</span></div>

            </article>;})}
            {!list.length&&<p className="px-1 py-6 text-center text-xs text-muted">Пусто</p>}</div>
        </div>;})}
    </div>
  </div>;
}

        <button onClick={onClose} className="rounded-lg p-2 hover:bg-surface2" aria-label="Закрыть"><Icon n="x"/></button></div>

        <div><dt className="text-muted">Бюджет</dt><dd className="num font-semibold">{eur(p.budget)}</dd></div>

}

/* ---------- shell ---------- */
const NAV=[['overview','Обзор','grid'],['projects','Проекты','folder'],['clients','Клиенты','users'],['tasks','Задачи','check'],['library','Компоненты','layers']];
function App(){
  const [view,setView]=useState(()=>{try{const h=location.hash.slice(1);return NAV.some(n=>n[0]===h)?h:'overview'}catch(e){return 'overview'}});
  const [pInit,setPInit]=useState({}); const [open,setOpen]=useState(null); const [nav,setNav]=useState(false); const [gq,setGq]=useState('');
  const [theme,setTheme]=useState(()=>{try{return localStorage.getItem('nt-theme')}catch(e){return null}});
  useEffect(()=>{if(theme)document.documentElement.dataset.theme=theme;try{theme&&localStorage.setItem('nt-theme',theme)}catch(e){}},[theme]);
  const isDark=theme?theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  const go=(v,status)=>{setView(v);if(v==='projects')setPInit({status:status||'Все',q:''});setNav(false);try{history.replaceState(null,'','#'+v)}catch(e){}window.scrollTo(0,0)};
  const counts={projects:PROJECTS.filter(p=>p.status!=='Готово').length,tasks:TASKS0.filter(t=>t.col!=='Готово').length};
  return <div className="min-h-full lg:pl-64">
    {nav&&<div className="fixed inset-0 z-30 bg-ink/30 lg:hidden" onClick={()=>setNav(false)}/>}
    <aside className={`fixed inset-y-0 left-0 z-40 flex w-64 flex-col border-r border-line bg-surface px-4 py-5 transition-transform lg:translate-x-0 ${nav?'translate-x-0':'-translate-x-full'}`}>
      <div className="flex items-center gap-2.5 px-2"><svg viewBox="0 0 32 32" className="h-8 w-8" aria-hidden="true"><rect width="32" height="32" rx="9" fill="rgb(var(--accent))"/><path d="M9 22V10l14 12V10" stroke="white" strokeWidth="2.6" fill="none" strokeLinecap="round" strokeLinejoin="round"/><circle cx="23" cy="10" r="2.4" fill="rgb(var(--accent2))"/></svg>
        <span className="text-xl font-bold" style={{fontFamily:'var(--display)'}}>NovaTrack</span></div>
      <p className="eyebrow mt-8 px-3">Рабочее пространство</p>
      <nav className="mt-2 space-y-1">{NAV.map(([k,l,i])=><button key={k} onClick={()=>go(k)} aria-current={view===k?'page':undefined}
        className={`flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium ${view===k?'bg-accent text-white':'text-muted hover:bg-surface2 hover:text-ink'}`}>
        <Icon n={i}/><span className="flex-1 text-left">{l}</span>{counts[k]&&<span className={`num rounded-full px-2 text-xs ${view===k?'bg-white/20':'bg-surface2'}`}>{counts[k]}</span>}</button>)}</nav>
      <div className="relative mt-auto overflow-hidden rounded-2xl bg-accent/[.08] p-4 pr-20">
        <img src="img/rocket.png" alt="" aria-hidden="true" className="absolute -right-4 top-1 w-24 h-auto rotate-6 select-none" draggable="false"/>
        <p className="text-sm font-semibold leading-snug">NovaTrack Pro</p>
        <p className="mt-1 text-xs text-muted">Порталы клиентов, счета и безлимитные отчёты.</p>
        <button className="mt-3 rounded-lg bg-accent px-3 py-1.5 text-xs font-semibold text-white hover:bg-accent/90">Подключить</button>
      </div>
    </aside>

    <header className="sticky z-20 flex items-center gap-3 border-b border-line bg-bg/85 px-4 py-3 backdrop-blur sm:px-6" style={{top:'env(safe-area-inset-top,0px)'}}>
      <button className="rounded-lg p-2 hover:bg-surface2 lg:hidden" onClick={()=>setNav(true)} aria-label="Открыть меню"><Icon n="menu"/></button>
      <form className="relative flex-1 max-w-md" onSubmit={e=>{e.preventDefault();setView('projects');setPInit({q:gq,status:'Все'})}}>
        <label htmlFor="gq" className="sr-only">Поиск проектов</label><Icon n="search" className="absolute left-3 top-2.5 h-4 w-4 text-muted"/>
        <input id="gq" value={gq} onChange={e=>setGq(e.target.value)} placeholder="Поиск проектов — нажмите Enter" className="w-full rounded-xl border border-line bg-surface py-2 pl-9 pr-3 text-sm placeholder:text-muted focus:outline-none focus:ring-2 focus:ring-accent/40"/></form>
      <div className="ml-auto flex items-center gap-1">
        <button onClick={()=>setTheme(isDark?'light':'dark')} className="rounded-lg p-2 text-muted hover:bg-surface2 hover:text-ink" aria-label="Сменить тему"><Icon n={isDark?'sun':'moon'}/></button>
        <button className="relative rounded-lg p-2 text-muted hover:bg-surface2 hover:text-ink" aria-label="Уведомления: 3 непрочитанных"><Icon n="bell"/><span className="absolute right-1.5 top-1.5 h-2 w-2 rounded-full bg-bad ring-2 ring-bg"/></button>
        <span className="ml-2 hidden sm:block text-right leading-tight"><span className="block text-sm font-semibold">Марк Рейес</span><span className="text-xs text-muted">Руководитель проектов</span></span>
        <span className="ml-2"><Avatar k="MR" size={34}/></span>
      </div>
    </header>

    <main className="mx-auto max-w-[1400px] px-4 py-6 sm:px-6">
      {view==='overview'&&<Overview go={go} openProject={setOpen}/>}
      {view==='projects'&&<Projects initial={pInit} openProject={setOpen}/>}
      {view==='clients'&&<Clients/>}
      {view==='tasks'&&<Tasks/>}
      {view==='library'&&<Library/>}
      <p className="mt-8 text-center text-xs text-muted mb-12">Концепт NovaTrack от <a href="../" className="underline">студии Nova Digital</a> · все клиенты, люди и цифры условные</p>
    </main>
    {open&&<Drawer p={open} onClose={()=>setOpen(null)}/>}
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<style>.lm-back{position:fixed;right:16px;bottom:16px;z-index:9999;display:inline-flex;align-items:center;gap:8px;padding:10px 16px 10px 12px;border-radius:999px;background:rgba(10,10,10,.82);color:#fff!important;font:500 13px/1 "Onest",system-ui,-apple-system,"Segoe UI",sans-serif;text-decoration:none!important;box-shadow:0 8px 24px -8px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.12);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .25s,background .25s}.lm-back:hover{transform:translateY(-2px);background:#0a0a0a}.lm-back svg{width:16px;height:16px;color:#cf8047}@media print{.lm-back{display:none}}@media(max-width:480px){.lm-back{padding:11px;gap:0;right:12px;bottom:12px}.lm-back-txt{display:none}}</style>
<a class="lm-back" href="../" aria-label="Вернуться на сайт студии Nova Digital"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="currentColor" d="M24 2c2.2 13.8 7.9 19.6 22 22-14.1 2.4-19.8 8.2-22 22-2.2-13.8-7.9-19.6-22-22 14.1-2.4 19.8-8.2 22-22Z"/></svg><span class="lm-back-txt">← Nova Digital</span></a>
</body>
</html>
